name: wsl-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: pwsh
        run: ./scripts/build-with-vs.ps1 -BuildDir build-diff -Target winuxcmd -Configuration Release
      - name: Test WSL + winuxcmd
        shell: pwsh
        run: |
          $wslVer = & wsl --version 2>&1 | Select-Object -First 2 | Out-String
          Write-Host "WSL version: $wslVer"
          $ws = & wsl -e bash -c '/mnt/d/a/WinuxCmd/WinuxCmd/build-diff/winuxcmd.exe echo hello; echo rc=$?' 2>&1 | Out-String
          Write-Host "winuxcmd: $ws"
      - name: Run differential under WSL
        shell: pwsh
        run: |
          $env:WINUXCMD_BIN = "/mnt/d/a/WinuxCmd/WinuxCmd/build-diff"
          $env:GNU_BIN = "/usr/bin"
          & wsl -e bash -c 'cd /mnt/d/a/WinuxCmd/WinuxCmd && tests/differential/runner.sh --results tests/differential/results.tsv --baseline tests/differential/baseline.json; echo RC=$?' 2>&1 | Out-String
      - name: Report
        shell: pwsh
        run: Get-Content tests/differential/results.tsv | Out-String
